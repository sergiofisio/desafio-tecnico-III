<div class="container mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-3xl font-bold text-gray-800">Exames</h2>
    <a
      routerLink="/exams/new"
      class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-colors"
    >
      Cadastrar Novo Exame
    </a>
  </div>

  <div *ngIf="isLoading" class="text-center text-gray-500 py-8">Carregando...</div>

  <div
    *ngIf="error"
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative"
  >
    <p>{{ error }}</p>
    <button
      (click)="loadExams()"
      class="mt-2 bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-3 rounded"
    >
      Tentar Novamente
    </button>
  </div>

  <div
    *ngIf="!isLoading && !error && exams.length > 0"
    class="bg-white shadow-md rounded-lg overflow-hidden"
  >
    <ul class="divide-y divide-gray-200">
      <li *ngFor="let exam of exams" class="p-4 hover:bg-gray-50 transition-colors">
        <div class="flex justify-between items-center">
          <div>
            <p class="font-semibold text-lg text-gray-900">{{ exam.patient.name }}</p>
            <p class="text-sm text-gray-600 mt-1">
              Data do Exame: {{ exam.examDate | date : 'dd/MM/yyyy' }}
            </p>
          </div>
          <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded-full">
            {{ exam.modality }}
          </span>
        </div>
      </li>
    </ul>
  </div>

  <p *ngIf="!isLoading && !error && exams.length === 0" class="text-center text-gray-500 mt-8">
    Nenhum exame encontrado.
  </p>
</div>
