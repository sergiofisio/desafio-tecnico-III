<div class="mb-4">
  <label class="block text-gray-700 text-sm font-bold mb-2">
    {{ label }}
  </label>
  <div class="relative">
    <input
      [type]="type === 'password' && showPassword ? 'text' : type"
      [placeholder]="placeholder || label"
      [mask]="mask"
      [value]="value"
      (input)="onInputChange($event)"
      (blur)="onTouched()"
      [disabled]="disabled"
      class="shadow appearance-none border rounded w-full py-2 px-3 pr-10 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
    />

    <button
      *ngIf="type === 'password'"
      type="button"
      (click)="togglePasswordVisibility()"
      class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none"
    >
      <svg
        *ngIf="showPassword"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-5 h-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
        />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <svg
        *ngIf="!showPassword"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-5 h-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3.981 18.067a10.01 10.01 0 01-1.34-4.406c0-4.638 3.5-8.447 8.127-8.995L12 3c-4.996 0-9.043 3.51-9.999 8.243a1.012 1.012 0 000 .639c.683 3.107 3.386 5.56 6.885 6.44l2.039 2.039c-.067.067-.133.133-.2.2-4.148-.962-7.585-3.568-9.019-7.126z"
        />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 19.5c.983 0 1.87-.145 2.724-.438M20 7.5V6.75A.75.75 0 0019.25 6h-.5m0 0a.75.75 0 00-.75.75v.5m0 0a.75.75 0 00.75.75h.5M20 12h.75m1.5 0A9.75 9.75 0 0021 9V6.75A2.25 2.25 0 0018.75 4.5H16.5m0 0c-.854-.142-1.741-.245-2.65-.297m-.95 2.1c-.86-.067-1.72-.1-2.592-.1-1.33 0-2.613.167-3.832.498"
        />
      </svg>
    </button>
  </div>
</div>
