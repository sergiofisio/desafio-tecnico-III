<button
  [type]="type"
  [disabled]="disabled"
  [ngClass]="{
    'bg-blue-600 hover:bg-blue-700': variant === 'primary',
    'bg-red-600 hover:bg-red-700': variant === 'danger',
    'bg-gray-200 hover:bg-gray-300 !text-gray-800': variant === 'document',
    'bg-gray-400 cursor-not-allowed': disabled
  }"
  class="text-white font-bold py-2 px-4 rounded-lg shadow-md transition-colors focus:outline-none focus:shadow-outline cursor-pointer"
>
  <ng-content></ng-content>
</button>
