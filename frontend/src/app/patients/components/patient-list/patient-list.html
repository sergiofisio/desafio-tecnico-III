<div class="container mx-auto p-6">
  <app-page-header title="Pacientes">
    <app-button actions routerLink="/patients/new" variant="gradient">
      Cadastrar Paciente
    </app-button>
  </app-page-header>

  <div *ngIf="isLoading" class="text-center text-gray-500 py-8">Carregando...</div>

  <div
    *ngIf="error"
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative"
  >
    <p>{{ error }}</p>
    <button
      (click)="loadPatients()"
      class="mt-2 bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-3 rounded"
    >
      Tentar Novamente
    </button>
  </div>

  <app-card *ngIf="patients.length !== 0">
    <ul class="flex flex-col gap-2">
      <li
        *ngFor="let patient of patients"
        class="flex items-center justify-between shadow-md border-2 border-white !p-2 rounded-3xl transition-all duration-500 ease-in-out hover:bg-white hover:text-[#0D0D57]"
      >
        <a [routerLink]="['/patients', patient.id]" class="block w-full h-full">
          <p class="font-semibold text-lg">{{ patient.name }}</p>
          <div class="text-sm mt-1">
            <span *ngFor="let doc of patient.documents" class="mr-4">
              <span class="font-medium">{{ doc.type }}:</span>
              {{ doc.document | mask : (doc.type | documentMask) }}
            </span>
          </div>
        </a>
        <app-button variant="danger" (click)="deletePatient(patient.id, patient.name)">
          Deletar
        </app-button>
      </li>
    </ul>
  </app-card>

  <p *ngIf="!isLoading && !error && patients.length === 0" class="text-center text-gray-500 mt-8">
    Nenhum paciente encontrado.
  </p>
</div>
