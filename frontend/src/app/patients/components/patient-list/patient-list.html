<div class="container mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-3xl font-bold text-gray-800">Pacientes</h2>
    <a
      routerLink="/patients/new"
      class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-colors"
    >
      Cadastrar Novo Paciente
    </a>
  </div>

  <div *ngIf="isLoading" class="text-center text-gray-500 py-8">Carregando...</div>

  <div
    *ngIf="error"
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative"
  >
    <p>{{ error }}</p>
    <button
      (click)="loadPatients()"
      class="mt-2 bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-3 rounded"
    >
      Tentar Novamente
    </button>
  </div>

  <div
    *ngIf="!isLoading && !error && patients.length > 0"
    class="bg-white shadow-md rounded-lg overflow-hidden"
  >
    <ul class="divide-y divide-gray-200">
      <li *ngFor="let patient of patients">
        <a
          [routerLink]="['/patients', patient.id]"
          class="block p-4 hover:bg-gray-50 transition-colors"
        >
          <p class="font-semibold text-lg text-gray-900">{{ patient.name }}</p>
          <div class="text-sm text-gray-600 mt-1">
            <span *ngFor="let doc of patient.documents" class="mr-4">
              <span class="font-medium">{{ doc.type }}:</span> {{ doc.document }}
            </span>
          </div>
        </a>
      </li>
    </ul>
  </div>

  <p *ngIf="!isLoading && !error && patients.length === 0" class="text-center text-gray-500 mt-8">
    Nenhum paciente encontrado.
  </p>
</div>
