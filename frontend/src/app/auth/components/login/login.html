<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="px-8 py-6 text-left bg-white shadow-lg rounded-lg max-w-sm w-full">
    <h3 class="text-2xl font-bold text-center text-gray-800">Login</h3>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-4">
      <div>
        <label class="block" for="email">Email</label>
        <input
          type="text"
          placeholder="seu@email.com"
          formControlName="email"
          class="w-full px-4 py-2 mt-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
        />
      </div>
      <div class="mt-4">
        <label class="block">Senha</label>
        <input
          type="password"
          placeholder="Senha"
          formControlName="password"
          class="w-full px-4 py-2 mt-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
        />
      </div>
      <div class="flex flex-col items-baseline justify-between">
        <button
          type="submit"
          [disabled]="isSubmitting"
          class="w-full px-6 py-2 mt-4 text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-400"
        >
          {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
        </button>
        <a routerLink="/register" class="cursor-pointer text-sm text-blue-600 hover:underline mt-4"
          >Não tem uma conta? Registre-se</a
        >
      </div>
      <div *ngIf="error" class="mt-4 text-red-600 text-sm text-center">
        {{ error }}
      </div>
    </form>
  </div>
</div>
